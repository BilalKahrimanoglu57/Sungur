<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNGUR - Ethno-Folk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background-color: #000;
        overflow-x: hidden;
      }

      /* ANA BÖLÜM VE ARKA PLAN AYARLARI */
      .hero-section {
        position: relative;
        height: 100vh;
        width: 100%;
        background-image: url("İmages/etnospor.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        display: flex;
        flex-direction: column;
        color: white;
      }

      /* SOLUKLAŞTIRMA KATMANI */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      /* ÜST BAR VE İNCE ÇİZGİ AYARI */
      header {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: space-between; /* Logo sola, Menü sağa */
        align-items: center; /* Dikeyde tam orta (Hizalama burada sağlanır) */
        padding: 20px 8%; /* Üst-alt boşluk ve yan boşluklar */

        /* İNCE ÇİZGİ */
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* LOGO YENİDEN YAPILANDIRMA (Hizaya girmesi için absolute kaldırıldı) */
      .logo-link {
        text-decoration: none !important;
        color: white !important;
        transition: all 0.3s ease;
      }

      .logo-text {
        color: white !important;
        font-size: 2rem; /* Çizgiyle uyum için hafif dengelendi */
        font-weight: 900;
        letter-spacing: 5px;
        margin: 0;
        line-height: 1; /* Dikey hizayı garantiye alır */
      }

      .logo-link:hover {
        transform: scale(1.05);
        opacity: 0.9;
      }

      /* SAĞ TARAF (Sosyal Medya + Navigasyon) */
      .header-right {
        display: flex;
        align-items: center;
      }

      .social-icons {
        display: flex;
        align-items: center;
      }

      .social-icons a {
        color: white;
        margin: 0 12px;
        font-size: 1.1rem;
        text-decoration: none;
        transition: 0.3s;
      }

      .social-icons a:hover {
        opacity: 0.7;
      }

      nav ul {
        display: flex;
        list-style: none;
        margin-left: 20px;
      }

      nav ul li {
        margin-left: 25px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
        line-height: 1;
      }

      nav ul li a:hover {
        color: #ccc;
      }

      /* İÇERİK ALANI */
      .hero-content {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 8%;
      }

      .main-text h2 {
        font-size: 4.5rem;
        font-weight: 900;
        margin-bottom: 10px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      }

      .main-text h4 {
        font-size: 1.2rem;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
      }

      /* SLIDER NOKTALARI */
      .slider-dots {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        margin: 0 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      .dot.active {
        background: white;
        transform: scale(1.3);
      }

      /* MOBİL UYUMLULUK */
      @media (max-width: 768px) {
        header {
          padding: 15px 5%;
        }
        .main-text h2 {
          font-size: 2.5rem;
        }
        .main-text h4 {
          font-size: 0.9rem;
          letter-spacing: 4px;
        }
        nav,
        .social-icons {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero-section">
      <div class="overlay"></div>

      <header>
        <a href="anasayfa.html" class="logo-link">
          <h1 class="logo-text">SUNGUR</h1>
        </a>

        <div class="header-right">
          <div class="social-icons">
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-spotify"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
          </div>
          <nav>
            <ul>
              <li><a href="anasayfa.html">Ana Sayfa</a></li>
              <li><a href="konser.html">Konser</a></li>
              <li><a href="diskografi.html">Diskografi</a></li>
              <li><a href="urunler.html">Ürünler</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <div class="hero-content">
        <div class="main-text">
          <h2>SUNGUR ETHNO-FOLK</h2>
          <h4>HALK SANATÇILARI</h4>
        </div>
      </div>

      <div class="slider-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </section>
  </body>
</html>
