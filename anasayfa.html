<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNGUR - Ethno-Folk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background-color: #000;
        overflow-x: hidden;
      }

      .hero-section {
        position: relative;
        height: 100vh;
        width: 100%;
        background-image: url("arka-plan-gorseli.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        color: white;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1;
      }

      header {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 30px 5%;
      }

      .social-icons a {
        color: white;
        margin: 0 10px;
        font-size: 1.1rem;
        text-decoration: none;
        transition: 0.3s;
      }

      nav ul {
        display: flex;
        list-style: none;
      }

      nav ul li {
        margin-left: 25px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.85rem;
        text-transform: uppercase;
      }

      /* MAVİ RENK SORUNUNU ÇÖZEN LOGO TASARIMI */
      .logo-link {
        position: absolute;
        top: 40px;
        left: 8%;
        z-index: 15;
        text-decoration: none !important; /* Alt çizgiyi zorla kaldırır */
        color: white !important; /* Maviliği zorla beyaz yapar */
        display: inline-block;
        transition: all 0.3s ease;
      }

      .logo-text {
        color: white !important; /* Yazının kendisini de beyaz tutar */
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: 5px;
        cursor: pointer;
        margin: 0;
      }

      .logo-link:hover {
        transform: scale(1.05);
        opacity: 0.9;
      }

      .logo-link:active {
        transform: scale(0.95);
      }

      .hero-content {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 8%;
      }

      .main-text h2 {
        font-size: 4.5rem;
        font-weight: 900;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      .main-text h4 {
        font-size: 1.2rem;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
      }

      .slider-dots {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        margin: 0 8px;
      }

      .dot.active {
        background: white;
      }

      @media (max-width: 768px) {
        .main-text h2 {
          font-size: 2.5rem;
        }
        nav,
        .social-icons {
          display: none;
        }
        .logo-link {
          top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero-section">
      <div class="overlay"></div>

      <a href="index.html" class="logo-link">
        <h1 class="logo-text">SUNGUR</h1>
      </a>

      <header>
        <div class="social-icons">
          <a href="#"><i class="fab fa-youtube"></i></a>
          <a href="#"><i class="fab fa-spotify"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="#">Konser</a></li>
            <li><a href="#">Diskografi</a></li>
            <li><a href="#">Ürünler</a></li>
          </ul>
        </nav>
      </header>

      <div class="hero-content">
        <div class="main-text">
          <h2>SUNGUR ETHNO-FOLK</h2>
          <h4>HALK SANATÇILARI</h4>
        </div>
      </div>
    </section>
  </body>
</html>
